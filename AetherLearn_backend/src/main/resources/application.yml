# =============================================================
# AetherLearn 后端配置（Spring Boot 3.4.x）
# 说明：数据源、JWT、文件上传、MyBatis-Plus 等配置集中在此。
# =============================================================

server:
  port: 8085
  servlet:
    context-path: /

spring:
  application:
    name: AetherLearn_backend
  # 多环境：默认激活 local 配置（application-local.yml，含密钥，已 gitignore）。
  # 部署到服务器时用环境变量 SPRING_PROFILES_ACTIVE=prod 关闭本地配置。
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  # ---------- 数据源（MySQL 8） ----------
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/aetherlearn?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
  # ---------- 静态资源（文件上传虚拟路径映射由 WebConfig 配置） ----------
  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB      # 单文件上限
      max-request-size: 60MB   # 单次请求上限
  # ---------- 安全：本项目鉴权完全走 JWT 过滤器（用户查库，非内存用户）----------
  # 关闭 Spring Security 默认的内存用户自动配置，避免空用户名导致启动失败
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# ---------- JWT 配置 ----------
jwt:
  secret: aetherlearn-default-secret-key-2026-please-change-in-prod-1234567890   # 生产务必替换
  expiration: 86400000          # 有效期（毫秒）：24 小时
  token-prefix: "Bearer "       # HTTP 头前缀

# ---------- 文件上传根目录（运行时生成 uploads/ 及各分桶） ----------
file:
  upload-dir: ./uploads         # 相对后端项目根目录；也可改为绝对路径

# ---------- LangChain4j 大模型配置（OpenAI 兼容接口） ----------
# LangChain4j 统一处理流式/同步、重试、超时；切换供应商只需改 base-url + model-name。
# 密钥放在 gitignored 的 application-local.yml，切勿提交。
#
# 供应商切换指南：
# ┌──────────────┬──────────────────────────────────────┬────────────────────────────────────────┐
# │ 供应商           base-url                                model-name
# ├──────────────┼──────────────────────────────────────┼────────────────────────────────────────┤
# │ 小米 MiMo       https://api.xiaomimimo.com/v1           mimo-v2.5-pro
# │ DeepSeek       https://api.deepseek.com/v1             deepseek-v4-flash
# │ OpenRouter     https://openrouter.ai/api/v1            nvidia/nemotron-3-ultra-550b-a55b:free
# └──────────────┴──────────────────────────────────────┴────────────────────────────────────────┘
langchain4j:
  open-ai:
    chat-model:
      base-url: https://api.deepseek.com/v1
      model-name: deepseek-v4-flash
      temperature: 0.3
      timeout: PT120S

# 业务层 AI 参数（RAG 检索配置，保留）
ai:
  enabled: true
  top-k: 5                      # 每问最多取 Top-K 个相关切片
  token-threshold: 2500        # 模型上下文token阈值
  token-ratio: 0.8             # 滑动窗口截断比例（取 Top-K 拼接至阈值的 80% ≈ 2000 token 即停）
  chunk-size: 600              # 文本切片字符上限

# ---------- AetherLearn 业务配置（L4/L5/L6 可配置项） ----------
aetherlearn:
  suggestion-limit: 10         # L4 学习建议数量上限
  score-ranges: 0-59,60-69,70-79,80-89,90-100  # L5 成绩分布分段
  weak-threshold: 40.0         # L6 知识薄弱判定阈值（错误率 %）

# ---------- MyBatis-Plus 配置 ----------
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.aetherlearn.entity
  configuration:
    map-underscore-to-camel-case: true   # 下划线自动转驼峰
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl  # 开发期打印 SQL（上线可关）
  global-config:
    db-config:
      logic-delete-field: isDeleted     # 全局逻辑删除字段（软删除）
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: auto                     # 主键自增

# ---------- 接口文档（SpringDoc 替代 Knife4j） ----------
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
